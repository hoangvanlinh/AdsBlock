<!DOCTYPE html>
<!-- Redirect target for blocked third-party embeds (social widgets, video
     players) that would otherwise leave a broken iframe behind. Rendered
     inside the blocked resource's own iframe, so it only needs to explain
     what happened — there's nothing here to click through to, since the
     embed itself is the thing being blocked. -->
<html>
  <head>
    <meta charset="utf-8">
    <title></title>
    <style>
      html, body {
        margin: 0;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f2f2f2;
        font: 13px/1.4 -apple-system, sans-serif;
        color: #666;
      }
    </style>
  </head>
  <body>
    <span>Embed blocked</span>
  </body>
</html>
